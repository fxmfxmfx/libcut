name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: file:/tmp/libcut-ci.db
      TIKTOK_CACHE_DIR: /tmp/libcut-ci-cache
      DEMO_MODE: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: mini-services/tiktok-comments
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - run: bun run db:generate
      - run: bun run check
      - run: bun run test:upgrade
      - run: bun run typecheck
        working-directory: mini-services/tiktok-comments
      - run: bun run build
        working-directory: mini-services/tiktok-comments
      - run: bun run test
        working-directory: mini-services/tiktok-comments
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t libcut:check .
      - name: Start and check the image
        run: |
          docker run -d --name libcut-check -e DEMO_MODE=true libcut:check
          ready=0
          for attempt in $(seq 1 30); do
            if docker exec libcut-check node -e "fetch('http://127.0.0.1:3000/api/tiktok/status').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          docker exec libcut-check node --input-type=module -e '
            const browser = await fetch("http://127.0.0.1:3040/health");
            if (!browser.ok) throw new Error("Browser service is not healthy");
            const feed = await (await fetch("http://127.0.0.1:3000/api/tiktok/feed")).json();
            if (!feed.videos?.length) throw new Error("Demo feed is empty");
            const response = await fetch(`http://127.0.0.1:3000/api/tiktok/videos/${feed.videos[0].id}/download`, { headers: { range: "bytes=0-31" } });
            if (response.status !== 206 || (await response.arrayBuffer()).byteLength !== 32) throw new Error("Video download failed");
            const search = await (await fetch("http://127.0.0.1:3000/api/tiktok/search?q=garlic&kind=video&source=live")).json();
            if (search.liveError || !search.results?.length || !search.results[0].publishedAt) throw new Error("Video search failed or erased metadata");
            console.log("Container startup, both services, feed, video search, and range download passed");
          '
      - name: Container logs
        if: failure()
        run: docker logs libcut-check || true
      - name: Stop the image
        if: always()
        run: docker rm -f libcut-check || true
