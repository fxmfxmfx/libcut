name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: file:/tmp/libcut-ci.db
      TIKTOK_CACHE_DIR: /tmp/libcut-ci-cache
      DEMO_MODE: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: mini-services/tiktok-comments
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - run: bun run db:generate
      - run: bun run check
      - run: bun run test:upgrade
      - run: bun run typecheck
        working-directory: mini-services/tiktok-comments
      - run: bun run test
        working-directory: mini-services/tiktok-comments
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t libcut:check .
