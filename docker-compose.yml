# Copy .env.example to .env, review its settings, then run:
#   docker compose up -d --build
# The default bind is loopback. Set LIBCUT_BIND only for a trusted network.

services:
  libcut:
    build:
      context: .
      dockerfile: Dockerfile
    image: libcut:latest
    container_name: libcut
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${LIBCUT_BIND:-127.0.0.1}:3000:3000"
    volumes:
      - libcut-db:/app/db
      - libcut-cache:/app/cache/videos
    env_file:
      - .env
    environment:
      DEMO_MODE: ${DEMO_MODE:-true}
      TIKTOK_PROXY: ${TIKTOK_PROXY:-}
      TIKTOK_CACHE_TTL_MIN: ${TIKTOK_CACHE_TTL_MIN:-10}
      TIKTOK_SOCKET_TIMEOUT: ${TIKTOK_SOCKET_TIMEOUT:-30}
      TIKTOK_RETRIES: ${TIKTOK_RETRIES:-3}
      DATA_MODE: ${DATA_MODE:-local}
      DATABASE_URL: file:/app/db/custom.db
      TIKTOK_CACHE_DIR: /app/cache/videos
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/tiktok/status').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  libcut-db:
  libcut-cache:
